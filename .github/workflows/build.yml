name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: ./app/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build

  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment:
          - lilygo-t-a7670g
          - lilygo-t-sim7000g
    defaults:
      run:
        working-directory: ./firmware
    env:
      WIFI_SSID: ci
      WIFI_PASS: ci
      SERVER_URL: http://localhost:3000/api/event
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv venv --seed
      - run: uv sync --locked
      - run: uv run pio run -e ${{ matrix.environment }}
