services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    env_file:
      - .env

  tiler:
    build:
      context: .
      dockerfile: Dockerfile.tiler
    ports:
      - 8000:8000

  postgres:
    image: postgis/postgis:18-3.6-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
