[env:lilygo-t-a7670g]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200 

src_filter = +<*.cpp> +<*.h>

build_unflags = 
    -std=gnu++11

build_flags = 
    -std=gnu++17
    -DLILYGO_T_A7670G
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.WIFI_PASS}\"
    -DSERVER_URL=\"${sysenv.SERVER_URL}\"

lib_deps =
    mikalhart/TinyGPSPlus
    https://github.com/TartanLlama/expected
