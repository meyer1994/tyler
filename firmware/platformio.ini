[env:lilygo-t-a7670g]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200 

src_filter = +<*.cpp> +<*.h>

build_unflags = 
    -std=gnu++11

build_flags =
    -std=gnu++17
    -DLILYGO_T_A7670
    -DTINY_GSM_MODEM_A7670
    -DSERVER_HOST=\"${sysenv.SERVER_HOST}\"
    -DSERVER_PORT=${sysenv.SERVER_PORT}
    -DSERVER_PATH=\"${sysenv.SERVER_PATH}\"
    -DCELLULAR_APN=\"${sysenv.CELLULAR_APN}\"

lib_deps =
    https://github.com/lewisxhe/TinyGSM  # celullar (lewisxhe fork required for A7670 support)
    arduino-libraries/ArduinoHttpClient
    mikalhart/TinyGPSPlus  # gps
    https://github.com/TartanLlama/expected  # std::expected
