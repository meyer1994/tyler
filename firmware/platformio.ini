[platformio]
default_envs = lilygo-t-a7670g

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.WIFI_PASS}\"
    -DSERVER_URL=\"${sysenv.SERVER_URL}\"

lib_deps =
    bblanchon/ArduinoJson
    mikalhart/TinyGPSPlus
    arduino-libraries/ArduinoHttpClient
    https://github.com/TartanLlama/expected
    https://github.com/lewisxhe/TinyGSM

[env:lilygo-t-a7670g]
build_flags =
    ${env.build_flags}
    -DLILYGO_T_A7670
    -DTINY_GSM_MODEM_A7670

[env:lilygo-t-sim7000g]
build_flags =
    ${env.build_flags}
    -DTRACKOWS_GPS_SIM7000G
    -DLILYGO_SIM7000G
    -DTINY_GSM_MODEM_SIM7000SSL
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
