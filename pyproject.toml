[project]
name = "tyler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "meyer1994", email = "1994meyer@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "geojson-pydantic>=2.2.0",
    "mercantile>=1.2.1",
    "pillow>=13.0.0",
    "pystac-client>=0.9.1",
    "rasterio>=1.5.2",
    "rio-tiler>=9.4.13",
    "shapely>=2.2.0",
    "titiler-application>=2.4.0",
    "titiler-core>=2.4.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
tyler = "tyler:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
