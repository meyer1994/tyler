services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres@postgres:5432/postgres

  postgres:
    image: postgis/postgis:18-3.6-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
